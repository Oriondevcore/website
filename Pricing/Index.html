<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orion Commercial Agreement</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        
        /* A4 Paper Look */
        .paper-sheet {
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-height: 297mm; /* A4 Height */
            position: relative;
        }

        /* Clean Inputs */
        .input-clean {
            border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 13px; outline: none; transition: all 0.2s;
        }
        .input-clean:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* Signature Canvas */
        .sig-canvas { border: 2px dashed #cbd5e1; background: #f8fafc; cursor: crosshair; touch-action: none; width: 100%; height: 120px; border-radius: 8px; }
        
        /* Print/PDF styles */
        @media print {
            body { background: white; }
            .paper-sheet { box-shadow: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // STATE
            const [rooms, setRooms] = useState(20);
            const [starRating, setStarRating] = useState(3);
            const [outlets, setOutlets] = useState(0);
            const [hotelName, setHotelName] = useState("");
            const [managerName, setManagerName] = useState("");
            
            // MODULES
            const [features, setFeatures] = useState({
                base: true,
                multilang: false,
                dashboard: false,
                managerTools: false,
                whatsapp: false
            });

            const [costs, setCosts] = useState({ monthly: 0, setup: 0 });
            
            // SIGNATURE
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [hasSignature, setHasSignature] = useState(false);

            // PRICING CONSTANTS
            const PRICES = {
                base: { setup: 4999, monthly: 999 },
                multilang: { setup: 2500, monthly: 500 },
                dashboard: { setup: 3500, monthly: 750 },
                managerTools: { setup: 5000, monthly: 1250 },
                whatsapp: { setup: 3500, monthly: 450 },
                outletCost: 3500 
            };

            // CALCULATION ENGINE (Your Logic)
            useEffect(() => {
                let monthly = PRICES.base.monthly;
                let setup = PRICES.base.setup;

                if (features.multilang) { monthly += PRICES.multilang.monthly; setup += PRICES.multilang.setup; }
                if (features.dashboard) { monthly += PRICES.dashboard.monthly; setup += PRICES.dashboard.setup; }
                if (features.managerTools) { monthly += PRICES.managerTools.monthly; setup += PRICES.managerTools.setup; }
                if (features.whatsapp) { monthly += PRICES.whatsapp.monthly; setup += PRICES.whatsapp.setup; }

                monthly += (outlets * PRICES.outletCost);

                // Room Scaling Logic
                let roomCost = 0;
                if (rooms > 18) {
                    const extraRooms = rooms - 18;
                    let ratePerRoom = 45; 
                    if (rooms > 100) ratePerRoom = 35;
                    if (rooms > 200) ratePerRoom = 25;
                    roomCost = extraRooms * ratePerRoom;
                }

                // Star Rating Multiplier
                let multiplier = 1;
                if (starRating === 4) multiplier = 1.25;
                if (starRating === 5) multiplier = 1.5;

                // Enterprise Cap Logic
                if (rooms >= 150) {
                     if (starRating === 3 && monthly < 18000) monthly = 18000;
                     if (starRating === 5 && monthly < 25000) monthly = 25000;
                } else {
                     monthly += roomCost;
                     monthly = monthly * multiplier;
                }

                setCosts({ monthly: Math.round(monthly), setup });
            }, [rooms, features, starRating, outlets]);

            const toggleFeature = (key) => setFeatures(prev => ({ ...prev, [key]: !prev[key] }));
            const formatZAR = (val) => new Intl.NumberFormat('en-ZA', { style: 'currency', currency: 'ZAR', maximumFractionDigits: 0 }).format(val);

            // CANVAS LOGIC
            const startDrawing = (e) => {
                const ctx = canvasRef.current.getContext('2d');
                const rect = canvasRef.current.getBoundingClientRect();
                // Handle Touch or Mouse
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d');
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
                setHasSignature(true);
            };
            
            const clearSig = () => {
                const ctx = canvasRef.current.getContext('2d');
                ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                setHasSignature(false);
            };

            const generatePDF = () => {
                if(!hotelName) return alert("Please enter Hotel Name");
                const element = document.getElementById('contract-body');
                const opt = {
                    margin: 0,
                    filename: `Orion_Contract_${hotelName}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                // Hide controls temporarily
                document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');
                
                html2pdf().set(opt).from(element).save().then(() => {
                    document.querySelectorAll('.no-print').forEach(el => el.style.display = 'block'); // Restore
                });
            };

            return (
                <div className="flex justify-center p-4 md:p-8">
                    <div id="contract-body" className="paper-sheet w-full max-w-4xl p-8 md:p-12 flex flex-col">
                        
                        {/* HEADER */}
                        <div className="flex justify-between items-start border-b border-slate-200 pb-6 mb-8">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">COMMERCIAL AGREEMENT</h1>
                                <p className="text-xs text-slate-500 font-medium uppercase mt-1 tracking-widest">Enterprise Software License</p>
                            </div>
                            <div className="text-right">
                                <div className="text-lg font-bold text-blue-700">ORION<span className="text-slate-900">DEV</span>CORE</div>
                                <div className="text-[10px] text-slate-400 mt-1">Reg: 2026/001234/07</div>
                                <div className="text-[10px] text-slate-400">{new Date().toLocaleDateString()}</div>
                            </div>
                        </div>

                        {/* CLIENT DETAILS SECTION */}
                        <div className="grid md:grid-cols-2 gap-8 mb-8">
                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-400 uppercase border-b border-slate-100 pb-2">Client Information</h3>
                                <input type="text" placeholder="Hotel / Property Name" className="input-clean font-bold text-sm" value={hotelName} onChange={e => setHotelName(e.target.value)} />
                                <input type="text" placeholder="Authorized Manager Name" className="input-clean" value={managerName} onChange={e => setManagerName(e.target.value)} />
                                <input type="email" placeholder="Billing Email Address" className="input-clean" />
                            </div>
                            
                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-400 uppercase border-b border-slate-100 pb-2">Property Configuration</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Room Count</label>
                                        <input type="number" value={rooms} onChange={e => setRooms(parseInt(e.target.value))} className="input-clean text-right font-mono" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Star Rating</label>
                                        <select value={starRating} onChange={e => setStarRating(parseInt(e.target.value))} className="input-clean text-right">
                                            <option value={3}>3 Star</option>
                                            <option value={4}>4 Star</option>
                                            <option value={5}>5 Star</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Revenue Centers (Bars/Spas)</label>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setOutlets(Math.max(0, outlets-1))} className="no-print bg-slate-100 px-2 py-1 rounded text-slate-600">-</button>
                                        <span className="font-mono text-sm font-bold w-6 text-center">{outlets}</span>
                                        <button onClick={() => setOutlets(outlets+1)} className="no-print bg-slate-100 px-2 py-1 rounded text-slate-600">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* MODULE SELECTION TABLE */}
                        <div className="mb-8">
                            <h3 className="text-xs font-bold text-slate-400 uppercase border-b border-slate-100 pb-2 mb-4">Software Modules</h3>
                            <table className="w-full text-sm">
                                <thead className="bg-slate-50 text-xs text-slate-500 uppercase font-semibold">
                                    <tr>
                                        <th className="py-2 pl-3 text-left">Module Name</th>
                                        <th className="py-2 text-right pr-4">Monthly Fee</th>
                                        <th className="py-2 text-center w-12 no-print">Act</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    <tr>
                                        <td className="py-3 pl-3">
                                            <div className="font-bold text-slate-700">Core Platform</div>
                                            <div className="text-xs text-slate-500">Guest AI Chat, Web App, Basic Routing</div>
                                        </td>
                                        <td className="py-3 text-right pr-4 font-mono text-slate-600">R 999</td>
                                        <td className="py-3 text-center no-print"><input type="checkbox" checked disabled className="accent-blue-600" /></td>
                                    </tr>
                                    <tr>
                                        <td className="py-3 pl-3">
                                            <div className="font-bold text-slate-700">Mission Control Dashboard</div>
                                            <div className="text-xs text-slate-500">Live Alerts, TTR Analytics, Staff Inbox</div>
                                        </td>
                                        <td className="py-3 text-right pr-4 font-mono text-slate-600">R 750</td>
                                        <td className="py-3 text-center no-print"><input type="checkbox" checked={features.dashboard} onChange={() => toggleFeature('dashboard')} className="accent-blue-600" /></td>
                                    </tr>
                                    <tr>
                                        <td className="py-3 pl-3">
                                            <div className="font-bold text-slate-700">Global Linguist Pack</div>
                                            <div className="text-xs text-slate-500">18 Languages (Incl. Zulu/Xhosa)</div>
                                        </td>
                                        <td className="py-3 text-right pr-4 font-mono text-slate-600">R 500</td>
                                        <td className="py-3 text-center no-print"><input type="checkbox" checked={features.multilang} onChange={() => toggleFeature('multilang')} className="accent-blue-600" /></td>
                                    </tr>
                                    <tr>
                                        <td className="py-3 pl-3">
                                            <div className="font-bold text-slate-700">AI Manager Tools</div>
                                            <div className="text-xs text-slate-500">Complaint Drafter, Itinerary Planner</div>
                                        </td>
                                        <td className="py-3 text-right pr-4 font-mono text-slate-600">R 1,250</td>
                                        <td className="py-3 text-center no-print"><input type="checkbox" checked={features.managerTools} onChange={() => toggleFeature('managerTools')} className="accent-blue-600" /></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        {/* TOTALS BLOCK */}
                        <div className="flex justify-end mb-8">
                            <div className="w-full md:w-1/2 bg-slate-50 border border-slate-200 rounded p-6">
                                <div className="flex justify-between items-center mb-2 text-sm">
                                    <span className="text-slate-500">One-Time Implementation</span>
                                    <span className="font-bold text-slate-700">{formatZAR(costs.setup)}</span>
                                </div>
                                <div className="flex justify-between items-center mb-4 text-sm">
                                    <span className="text-slate-500">Monthly Subscription</span>
                                    <span className="font-bold text-slate-700">{formatZAR(costs.monthly)}</span>
                                </div>
                                <div className="border-t border-slate-300 pt-3 flex justify-between items-center">
                                    <span className="text-xs font-bold uppercase text-slate-900">Total Due on Signing</span>
                                    <span className="text-xl font-bold text-blue-700">{formatZAR(costs.setup + costs.monthly)}</span>
                                </div>
                            </div>
                        </div>

                        {/* SIGNATURE SECTION */}
                        <div className="mt-auto pt-6 border-t border-slate-200">
                            <div className="grid md:grid-cols-2 gap-8">
                                <div>
                                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Terms of Acceptance</h4>
                                    <p className="text-[10px] text-slate-500 leading-relaxed mb-4">
                                        By signing below, the Client agrees to the Terms of Service. This agreement includes a 12-month initial term. Payment is due upon system activation.
                                    </p>
                                    <div className="text-xs font-bold text-slate-900">Signed at: <span className="font-normal">{new Date().toLocaleDateString()}</span></div>
                                </div>
                                
                                <div>
                                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Authorized Signature</h4>
                                    <canvas 
                                        ref={canvasRef} 
                                        width={400} 
                                        height={120}
                                        className="sig-canvas mb-2"
                                        onMouseDown={startDrawing}
                                        onMouseMove={draw}
                                        onMouseUp={() => setIsDrawing(false)}
                                        onMouseLeave={() => setIsDrawing(false)}
                                        onTouchStart={startDrawing}
                                        onTouchMove={draw}
                                        onTouchEnd={() => setIsDrawing(false)}
                                    />
                                    <div className="flex justify-between items-center no-print">
                                        <button onClick={clearSig} className="text-xs text-red-400 hover:text-red-600 font-bold">Clear Signature</button>
                                        <button 
                                            onClick={generatePDF} 
                                            className="bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded shadow hover:bg-blue-800 transition flex items-center gap-2"
                                        >
                                            <i className="ph ph-file-pdf"></i> GENERATE CONTRACT
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        {/* FOOTER */}
                        <div className="text-center mt-8 pt-4 border-t border-slate-100 text-[9px] text-slate-400 uppercase tracking-wider">
                            Orion Dev Core &copy; 2026 | Enterprise Hospitality Systems
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
